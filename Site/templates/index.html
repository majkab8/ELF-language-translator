<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>English to Elvish Translator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='main.js') }}" defer></script>
</head>
<body>
    <main class="main-page">
        <h1>English to Elvish Translator</h1>
        <div class="translation-section">
            <div class="input-section">
                <label for="input-area" class="area-title">English</label>
                <textarea class="input-area" id="input-area" rows="3" placeholder="Type text in English..."></textarea>
                <button class="translate-button" id="translate-button">Translate</button>
            </div>
            <svg class="arrow" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            <div class="output-section">
                <p class="area-title">Elvish</p>
                <div class="output-area" id="output-area" aria-live="polite"></div>
            </div>
        </div>
    </main>
</body>
</html>
